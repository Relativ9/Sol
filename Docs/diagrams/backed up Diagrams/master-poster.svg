<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="880" viewBox="0 0 1320 880" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="660" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2933">Sol: Master Functional Flow</text>
  <text x="660" y="52" text-anchor="middle" font-size="11" fill="#616e7c">Simplified edges. Full edges and sequence diagrams: Docs/FLOWS.md</text>

  <!-- Input -->
  <rect x="30" y="70" width="250" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="44" y="92" font-size="13" font-weight="bold" fill="#1f2933">Input (PlayerInput)</text>
  <text x="44" y="112" font-size="10.5" fill="#3e4c59">Space: Jump</text>
  <text x="44" y="128" font-size="10.5" fill="#3e4c59">WASD: Move, Run</text>
  <text x="44" y="144" font-size="10.5" fill="#3e4c59">LMB: talent nodes (UI map)</text>

  <!-- PlayerController and state -->
  <rect x="320" y="70" width="300" height="120" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="334" y="92" font-size="13" font-weight="bold" fill="#1f2933">PlayerController</text>
  <text x="334" y="112" font-size="10.5" fill="#3e4c59">OnJump, OnMove, OnRun, OnAttack</text>
  <text x="334" y="128" font-size="10.5" fill="#3e4c59">FixedUpdate: active state</text>

  <!-- Movement states -->
  <rect x="320" y="250" width="300" height="80" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="334" y="272" font-size="13" font-weight="bold" fill="#1f2933">Jumping</text>
  <text x="334" y="292" font-size="10.5" fill="#3e4c59">HandleJumpInput, AddForce Impulse</text>
  <rect x="320" y="360" width="300" height="80" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="334" y="382" font-size="13" font-weight="bold" fill="#1f2933">Movement</text>
  <text x="334" y="402" font-size="10.5" fill="#3e4c59">ProcessMovement, linearVelocity</text>
  <rect x="660" y="250" width="260" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="674" y="272" font-size="13" font-weight="bold" fill="#1f2933">GroundChecker</text>
  <text x="674" y="292" font-size="10.5" fill="#3e4c59">FixedUpdate cast, coyote time</text>
  <rect x="660" y="360" width="260" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="674" y="382" font-size="13" font-weight="bold" fill="#1f2933">GravityController</text>
  <text x="674" y="402" font-size="10.5" fill="#3e4c59">AddForce Acceleration, clamp</text>

  <!-- Physics sink -->
  <rect x="960" y="250" width="280" height="190" rx="6" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="974" y="272" font-size="13" font-weight="bold" fill="#1f2933">Rigidbody</text>
  <text x="974" y="292" font-size="10.5" fill="#3e4c59">linearVelocity, AddForce</text>
  <text x="974" y="312" font-size="10.5" fill="#3e4c59">Four writers (finding F2):</text>
  <text x="974" y="332" font-size="10.5" fill="#3e4c59">Jumping, Movement,</text>
  <text x="974" y="348" font-size="10.5" fill="#3e4c59">GravityController,</text>
  <text x="974" y="364" font-size="10.5" fill="#3e4c59">PlayerController.ApplyMovement</text>

  <rect x="660" y="70" width="260" height="120" rx="6" fill="#fff8e1" stroke="#b28704" stroke-width="1.5"/>
  <text x="674" y="92" font-size="13" font-weight="bold" fill="#1f2933">State dictionary</text>
  <text x="674" y="112" font-size="10.5" fill="#3e4c59">SetStateValue / GetStateValue</text>
  <text x="674" y="128" font-size="10.5" fill="#3e4c59">JumpPriority, IsGrounded, IsRunning</text>
  <rect x="960" y="70" width="280" height="120" rx="6" fill="#f3e8ff" stroke="#7e3ff2" stroke-width="1.5"/>
  <text x="974" y="92" font-size="13" font-weight="bold" fill="#1f2933">PlayerAnimationController</text>
  <text x="974" y="112" font-size="10.5" fill="#3e4c59">Reads JumpTriggered, IsRunning</text>

  <!-- Talents and UI -->
  <rect x="30" y="250" width="250" height="80" rx="6" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
  <text x="44" y="272" font-size="13" font-weight="bold" fill="#1f2933">TalentTreeController</text>
  <text x="44" y="292" font-size="10.5" fill="#3e4c59">OnNodeClicked, TryAllocate</text>
  <rect x="30" y="360" width="250" height="80" rx="6" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
  <text x="44" y="382" font-size="13" font-weight="bold" fill="#1f2933">TalentStateService</text>
  <text x="44" y="402" font-size="10.5" fill="#3e4c59">TryAllocatePoint, Raise event</text>
  <rect x="30" y="470" width="250" height="90" rx="6" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
  <text x="44" y="492" font-size="13" font-weight="bold" fill="#1f2933">UIManager</text>
  <text x="44" y="512" font-size="10.5" fill="#3e4c59">Panels, TogglePause (TimeManager)</text>
  <text x="44" y="528" font-size="10.5" fill="#3e4c59">RequestImmediateSave</text>

  <!-- Stats and environment -->
  <rect x="320" y="480" width="300" height="90" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="334" y="502" font-size="13" font-weight="bold" fill="#1f2933">Modifier triggers</text>
  <text x="334" y="522" font-size="10.5" fill="#3e4c59">Gravity, SpeedBoost (OnTriggerEnter)</text>
  <rect x="660" y="480" width="260" height="90" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="674" y="502" font-size="13" font-weight="bold" fill="#1f2933">StatsService</text>
  <text x="674" y="522" font-size="10.5" fill="#3e4c59">GetStat, ApplyOrReplaceModifier</text>
  <text x="674" y="538" font-size="10.5" fill="#3e4c59">Raises OnStatsChanged</text>

  <!-- Time -->
  <rect x="660" y="620" width="260" height="70" rx="6" fill="#e8eaf6" stroke="#283593" stroke-width="1.5"/>
  <text x="674" y="642" font-size="13" font-weight="bold" fill="#1f2933">TimeManager</text>
  <text x="674" y="662" font-size="10.5" fill="#3e4c59">Day, season, year events</text>
  <rect x="960" y="620" width="280" height="70" rx="6" fill="#e8eaf6" stroke="#283593" stroke-width="1.5"/>
  <text x="974" y="642" font-size="13" font-weight="bold" fill="#1f2933">World scripts</text>
  <text x="974" y="662" font-size="10.5" fill="#3e4c59">Celestial, clouds, skybox (polled)</text>

  <!-- Save -->
  <rect x="320" y="620" width="300" height="70" rx="6" fill="#ede7f6" stroke="#4527a0" stroke-width="1.5"/>
  <text x="334" y="642" font-size="13" font-weight="bold" fill="#1f2933">GameEventListener [scene]</text>
  <text x="334" y="662" font-size="10.5" fill="#3e4c59">Binds RequestLazySave</text>
  <rect x="320" y="720" width="300" height="70" rx="6" fill="#ede7f6" stroke="#4527a0" stroke-width="1.5"/>
  <text x="334" y="742" font-size="13" font-weight="bold" fill="#1f2933">SaveManager</text>
  <text x="334" y="762" font-size="10.5" fill="#3e4c59">2 s debounce, BuildSaveData</text>
  <rect x="660" y="720" width="260" height="70" rx="6" fill="#ede7f6" stroke="#4527a0" stroke-width="1.5"/>
  <text x="674" y="742" font-size="13" font-weight="bold" fill="#1f2933">SaveService</text>
  <text x="674" y="762" font-size="10.5" fill="#3e4c59">JSON via JsonUtility</text>
  <rect x="960" y="720" width="280" height="70" rx="6" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="974" y="742" font-size="13" font-weight="bold" fill="#1f2933">persistentDataPath</text>
  <text x="974" y="762" font-size="10.5" fill="#3e4c59">Save slot "default"</text>


  <!-- Direct calls (solid) -->
  <line x1="280" y1="130" x2="320" y2="130" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="470" y1="190" x2="470" y2="250" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="476" y="224" font-size="10" fill="#52606d">HandleJumpInput</text>
  <line x1="620" y1="290" x2="660" y2="290" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="920" y1="400" x2="960" y2="400" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="922" y="392" font-size="10" fill="#52606d">AddForce</text>
  <line x1="620" y1="525" x2="660" y2="525" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="622" y="517" font-size="10" fill="#52606d">ApplyModifier</text>
  <line x1="470" y1="690" x2="470" y2="720" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="476" y="708" font-size="10" fill="#52606d">RequestLazySave</text>
  <line x1="620" y1="755" x2="660" y2="755" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="920" y1="755" x2="960" y2="755" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="155" y1="330" x2="155" y2="360" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="160" y="348" font-size="10" fill="#52606d">TryAllocatePoint</text>
  <line x1="155" y1="440" x2="155" y2="470" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="470" y1="440" x2="470" y2="458" stroke="#444" stroke-width="0"/>

  <!-- State and event links (dashed) -->
  <line x1="620" y1="110" x2="660" y2="110" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="920" y1="110" x2="960" y2="110" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="790" y1="250" x2="790" y2="190" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="796" y="226" font-size="10" fill="#52606d">IsGrounded</text>
  <line x1="790" y1="480" x2="790" y2="440" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="796" y="464" font-size="10" fill="#52606d">GetStat</text>
  <line x1="660" y1="655" x2="620" y2="655" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="600" y="648" font-size="10" fill="#52606d">day / season events</text>
  <line x1="920" y1="655" x2="960" y2="655" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- Legend -->
  <text x="30" y="842" font-size="10.5" fill="#3e4c59">Solid arrow: direct call. Dashed arrow: state or event. [scene] = wired in a Unity scene, not in code.</text>
  <text x="30" y="860" font-size="10.5" fill="#3e4c59">Chains shown: jump (Space), move (WASD), gravity and modifiers, talent allocation to save, time events.</text>
</svg>
